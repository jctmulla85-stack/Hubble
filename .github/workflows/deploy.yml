name: Deploy to Google Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/915289470162/locations/global/workloadIdentityPools/workload/providers/github-provider'
        service_account: 'alpaca-bot@project-3bbffec0-8bd2-4acf-ac41.iam.gserviceaccount.com'
        
